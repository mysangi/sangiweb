<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9fc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Self Learners</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%; width: 100%;
      overflow: hidden;
      background: #f5f9fc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .wrapper { position: fixed; inset: 0; width: 100%; height: 100%; background: #f5f9fc; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #f5f9fc; }
    .loader {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #f5f9fc; color: #124263;
      font-size: 0.85rem; font-weight: 600;
      letter-spacing: 0.03em;
      z-index: 10; opacity: 1;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .loader.hide { opacity: 0; }
    .loader span { display: inline-block; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div class="loader" id="loader"><span>Loading Self Learners…</span></div>

  <div class="wrapper">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwSk02eslavaH8ChLh2tSazFYyTK4ny_USnmbgTlLOfquq02yDzFfVS0HDbowVDM7Nq/exec"
      allow="clipboard-write"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads">
    </iframe>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      var frame  = document.getElementById('appFrame');
      function hideLoader() { if (loader) loader.classList.add('hide'); }
      if (frame) frame.addEventListener('load', hideLoader);
      setTimeout(hideLoader, 6000);
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
    })();
  </script>
</body>
</html>
